<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labo Électronique Virtuel</title>
<meta name="description" content="Laboratoire Électronique Virtuel : concevez des schémas électroniques, électrotechniques, de bâtiment et d'énergies renouvelables, simulez, dimensionnez et exportez en PDF — gratuitement, dans le navigateur.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://christbcmc-lgtm.github.io/labo-electronique-virtuel/">
<!-- Réseaux sociaux / partage (Open Graph + Twitter Card) — améliore aussi l'aperçu affiché
     par Google et les messageries quand le lien est partagé. Adaptez cette URL si un domaine
     personnalisé est configuré un jour (fichier CNAME) : elle doit alors le refléter ici. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Labo Électronique Virtuel">
<meta property="og:description" content="Concevez, simulez et exportez vos schémas électriques, électrotechniques, de bâtiment et d'énergies renouvelables — gratuitement, dans le navigateur.">
<meta property="og:url" content="https://christbcmc-lgtm.github.io/labo-electronique-virtuel/">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Labo Électronique Virtuel">
<meta name="twitter:description" content="Concevez, simulez et exportez vos schémas électriques, électrotechniques, de bâtiment et d'énergies renouvelables — gratuitement, dans le navigateur.">
<!-- Client Supabase (chargé même si Supabase n'est pas encore configuré : voir
     js/config.js — l'app tourne alors en mode démo locale et cette librairie
     reste inutilisée). Doit être chargé AVANT js/config.js. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Three.js (r128, CDN) : utilisé par la vue 3D du bâtiment (js/plan3d.js) et l'atelier CAO
     mécanique 3D (js/cao3d.js). Chargement non bloquant pour le reste du site ; si indisponible
     (réseau, bloqueur), ces deux vues affichent un message au lieu de planter -- voir
     threeAvailable()/webglAvailable() dans chacun de ces fichiers. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/plan.css">
<link rel="stylesheet" href="css/plan3d.css">
<link rel="stylesheet" href="css/cao3d.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app"></main>
  <div class="toast-wrap" id="toasts"></div>

  <!-- Scripts classiques (pas de modules ES) : fonctionne aussi ouvert en local via file://,
       sans serveur ni étape de build. L'ordre de chargement ci-dessous est important : chaque
       fichier peut utiliser des fonctions/constantes définies par les fichiers précédents. -->
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/devis.js"></script>
  <script src="js/dimensionnement.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/plan3d.js"></script>
  <script src="js/cao3d.js"></script>
  <script src="js/composant-builder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
