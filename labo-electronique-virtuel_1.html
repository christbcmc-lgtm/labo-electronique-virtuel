<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labo Électronique Virtuel</title>
<style>
/* ==========================================================================
   Labo Électronique Virtuel — feuille de style
   Direction : établi électronique / oscilloscope. Fond quasi-noir façon PCB,
   traces ambre (signal actif) et cyan (mesure), typo technique.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:            #0B0F0D;
  --bg-raised:     #101613;
  --panel:         #121A16;
  --panel-border:  #223028;
  --trace:         #1B2620;

  --text:          #E8ECEA;
  --text-muted:    #7E9089;
  --text-faint:    #4E5D57;

  --amber:         #F5A623;
  --amber-dim:     #7A5416;
  --cyan:          #4FD1C5;
  --cyan-dim:      #235650;
  --danger:        #E4572E;
  --danger-dim:    #5c2416;
  --ok:            #6FCF7A;

  --radius:        3px;
  --font-display:  'Space Grotesk', sans-serif;
  --font-body:     'Inter', sans-serif;
  --font-mono:     'IBM Plex Mono', monospace;

  --header-h: 60px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.pcb-grid{
  background-image:
    linear-gradient(var(--trace) 1px, transparent 1px),
    linear-gradient(90deg, var(--trace) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: -1px -1px;
}

h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0 0 .4em; letter-spacing:-0.01em; }
p{ margin:0 0 1em; color:var(--text-muted); }
a{ color:var(--cyan); text-decoration:none; }
a:hover{ text-decoration:underline; }
code, .mono{ font-family:var(--font-mono); }

button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  padding:.65em 1.2em; border-radius:var(--radius); border:1px solid var(--panel-border);
  background:var(--bg-raised); color:var(--text); font-weight:500; font-size:.92em;
  transition:border-color .15s, background .15s, color .15s;
}
.btn:hover{ border-color:var(--text-faint); }
.btn-primary{ background:var(--amber); color:#1a1206; border-color:var(--amber); font-weight:600; }
.btn-primary:hover{ background:#ffb736; }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); }
.btn-ghost:hover{ color:var(--text); border-color:var(--panel-border); }
.btn-danger{ background:transparent; border-color:var(--danger-dim); color:var(--danger); }
.btn-danger:hover{ background:var(--danger-dim); }
.btn-block{ width:100%; }
.btn-sm{ padding:.4em .8em; font-size:.82em; }

.field{ margin-bottom:1.1em; text-align:left; }
.field label{ display:block; font-size:.8em; color:var(--text-muted); margin-bottom:.4em; }
.field input, .field select, .field textarea{
  width:100%; padding:.7em .8em; background:var(--bg); border:1px solid var(--panel-border);
  border-radius:var(--radius); color:var(--text);
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--cyan); }
.field-hint{ font-size:.76em; color:var(--text-faint); margin-top:.35em; }
.field-pw{ position:relative; }
.field-pw button{ position:absolute; right:.6em; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-faint); font-size:.75em; }
.field-error{ color:var(--danger); font-size:.8em; margin-top:.4em; }

.pill{ display:inline-flex; align-items:center; gap:.4em; padding:.25em .65em; border-radius:20px; font-size:.72em; font-family:var(--font-mono); border:1px solid var(--panel-border); color:var(--text-muted);}
.pill-dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); }
.pill-cyan{ border-color:var(--cyan-dim); color:var(--cyan); }
.pill-amber{ border-color:var(--amber-dim); color:var(--amber); }

.hidden{ display:none !important; }
.container{ max-width:1180px; margin:0 auto; padding:0 24px; }

/* ---- TOPBAR ---- */
.topbar{
  position:sticky; top:0; z-index:40; height:var(--header-h);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; background:rgba(11,15,13,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--panel-border);
}
.brand{ display:flex; align-items:center; gap:.6em; font-family:var(--font-display); font-weight:700; font-size:1.05em; color:var(--text); }
.brand .brand-mark{ color:var(--amber); font-size:1.3em; line-height:1; }
.topbar nav{ display:flex; align-items:center; gap:6px; }
.navlink{ padding:.5em .8em; border-radius:var(--radius); color:var(--text-muted); font-size:.88em; font-weight:500; }
.navlink.active{ color:var(--text); background:var(--panel); }
.topbar .right{ display:flex; align-items:center; gap:10px; }
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--panel); border:1px solid var(--panel-border);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.78em; color:var(--cyan);
}

/* ---- LANDING ---- */
.hero{ padding:96px 24px 80px; text-align:center; position:relative; overflow:hidden; }
.hero .eyebrow{ font-family:var(--font-mono); font-size:.78em; color:var(--cyan); letter-spacing:.14em; text-transform:uppercase; margin-bottom:1em; }
.hero h1{ font-size:clamp(2.1em,5vw,3.4em); max-width:920px; margin:0 auto .4em; }
.hero h1 .accent{ color:var(--amber); }
.hero p.lead{ max-width:620px; margin:0 auto 2em; font-size:1.05em; }
.hero-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

.scope-readout{
  margin:64px auto 0; max-width:640px; background:var(--panel); border:1px solid var(--panel-border);
  border-radius:6px; padding:20px 24px; text-align:left; font-family:var(--font-mono); font-size:.82em; color:var(--cyan);
}
.scope-readout svg{ width:100%; display:block; }
.scope-readout .scope-labels{ display:flex; justify-content:space-between; color:var(--text-faint); margin-top:8px; }

.spaces{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:1000px; margin:0 auto; padding:0 24px 100px; }
@media (max-width:820px){ .spaces{ grid-template-columns:1fr; } }
.space-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:6px; padding:26px; text-align:left; transition:border-color .15s, transform .15s; }
.space-card:hover{ border-color:var(--amber-dim); transform:translateY(-2px); }
.space-card .icon{ font-size:1.6em; margin-bottom:.5em; display:block; }
.space-card h3{ font-size:1.05em; margin-bottom:.3em; }
.space-card p{ font-size:.88em; margin:0; }

/* ---- AUTH ---- */
.auth-shell{ min-height:calc(100vh - var(--header-h)); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
.auth-card{ width:100%; max-width:400px; background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:34px 30px; text-align:center; }
.auth-card h2{ font-size:1.3em; }
.auth-card .sub{ font-size:.86em; margin-bottom:1.6em; }
.auth-divider{ display:flex; align-items:center; gap:10px; margin:1.2em 0; color:var(--text-faint); font-size:.78em; }
.auth-divider::before, .auth-divider::after{ content:''; flex:1; height:1px; background:var(--panel-border); }
.auth-switch{ margin-top:1.4em; font-size:.86em; color:var(--text-muted); }
.step-indicator{ display:flex; justify-content:center; gap:6px; margin-bottom:1.4em; }
.step-indicator span{ width:22px; height:3px; border-radius:2px; background:var(--panel-border); }
.step-indicator span.active{ background:var(--amber); }
.magic-note{ background:var(--bg); border:1px dashed var(--panel-border); border-radius:var(--radius); padding:10px 12px; font-size:.78em; color:var(--text-faint); text-align:left; margin-bottom:1.2em; }

/* ---- APP SHELL ---- */
.app-shell{ display:flex; min-height:calc(100vh - var(--header-h)); }
.sidebar{ width:220px; flex-shrink:0; border-right:1px solid var(--panel-border); background:var(--bg-raised); padding:20px 12px; display:flex; flex-direction:column; gap:2px; }
.sidebar .sb-label{ font-family:var(--font-mono); font-size:.68em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; margin:14px 10px 6px; }
.sidebar .sb-link{ display:flex; align-items:center; gap:.6em; padding:.55em .7em; border-radius:var(--radius); color:var(--text-muted); font-size:.88em; font-weight:500; }
.sidebar .sb-link:hover{ background:var(--panel); color:var(--text); text-decoration:none; }
.sidebar .sb-link.active{ background:var(--panel); color:var(--amber); border-left:2px solid var(--amber); padding-left:calc(.7em - 2px); }
.main{ flex:1; min-width:0; padding:30px 34px; }
.main-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
.main-header h2{ font-size:1.4em; }

.grid{ display:grid; gap:16px; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:900px){ .grid-3,.grid-2{ grid-template-columns:1fr; } }

.card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:6px; padding:20px; }
.card h3{ font-size:1em; }
.card.pad-0{ padding:0; }

.project-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:10px; transition:border-color .15s; }
.project-card:hover{ border-color:var(--cyan-dim); }
.project-card .thumb{ height:90px; border-radius:4px; background:linear-gradient(var(--trace) 1px, transparent 1px), linear-gradient(90deg, var(--trace) 1px, transparent 1px); background-size:14px 14px; background-color:var(--bg); border:1px solid var(--panel-border); }
.project-card .meta{ display:flex; justify-content:space-between; align-items:center; font-size:.76em; color:var(--text-faint); font-family:var(--font-mono); }
.project-card-new{ border:1px dashed var(--panel-border); display:flex; align-items:center; justify-content:center; gap:.5em; color:var(--text-muted); min-height:150px; font-size:.9em; background:transparent; }
.project-card-new:hover{ border-color:var(--amber-dim); color:var(--amber); }

.stat{ text-align:left; }
.stat .num{ font-family:var(--font-mono); font-size:2em; color:var(--amber); }
.stat .lbl{ font-size:.78em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }

table.data-table{ width:100%; border-collapse:collapse; font-size:.86em; }
.data-table th{ text-align:left; font-size:.72em; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--panel-border); }
.data-table td{ padding:9px 10px; border-bottom:1px solid var(--trace); color:var(--text-muted); }
.data-table tr:hover td{ background:var(--bg-raised); }

/* ---- ESPACE DE TRAVAIL ---- */
.workspace{ display:flex; height:calc(100vh - var(--header-h)); }
.ws-tools{ width:190px; border-right:1px solid var(--panel-border); background:var(--bg-raised); padding:16px 10px; overflow-y:auto; }
.ws-tools h4{ font-size:.7em; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:14px 6px 8px; }
.ws-comp{ display:flex; align-items:center; gap:.6em; padding:.5em .6em; border-radius:var(--radius); font-size:.84em; color:var(--text-muted); border:1px solid transparent; background:transparent; width:100%; text-align:left; }
.ws-comp:hover{ background:var(--panel); color:var(--text); border-color:var(--panel-border); cursor:grab; }
.ws-canvas-wrap{ flex:1; display:flex; flex-direction:column; min-width:0; }
.ws-topbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--panel-border); }
.ws-canvas{ flex:1; position:relative; background-color:var(--bg); background-image:linear-gradient(var(--trace) 1px, transparent 1px), linear-gradient(90deg, var(--trace) 1px, transparent 1px); background-size:24px 24px; overflow:hidden; }
.ws-canvas .placeholder-msg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:var(--text-faint); font-size:.9em; text-align:center; padding:20px; }
.ws-node{ position:absolute; width:64px; height:44px; background:var(--panel); border:1px solid var(--cyan-dim); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:.7em; font-family:var(--font-mono); color:var(--cyan); cursor:move; user-select:none; }
.ws-right{ width:280px; border-left:1px solid var(--panel-border); background:var(--bg-raised); display:flex; flex-direction:column; }
.ws-tabs{ display:flex; border-bottom:1px solid var(--panel-border); }
.ws-tab{ flex:1; padding:.7em; text-align:center; font-size:.8em; color:var(--text-muted); border-bottom:2px solid transparent; background:transparent; border-top:none; border-left:none; border-right:none; }
.ws-tab.active{ color:var(--cyan); border-color:var(--cyan); }
.ws-panel{ padding:16px; overflow-y:auto; flex:1; }
.readout{ font-family:var(--font-mono); font-size:1.5em; color:var(--cyan); background:var(--bg); border:1px solid var(--panel-border); border-radius:var(--radius); padding:14px; text-align:center; }
.diag-ok{ display:flex; gap:.6em; align-items:flex-start; font-size:.85em; color:var(--ok); }
.diag-error{ display:flex; gap:.6em; align-items:flex-start; font-size:.85em; color:var(--danger); background:var(--danger-dim); border-radius:var(--radius); padding:10px; margin-bottom:8px; }

/* ---- FILS DE DISCUSSION ---- */
.thread{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; max-height:420px; overflow-y:auto; padding-right:4px; }
.msg{ max-width:80%; padding:.6em .85em; border-radius:8px; font-size:.87em; background:var(--panel); border:1px solid var(--panel-border); }
.msg .who{ font-family:var(--font-mono); font-size:.72em; color:var(--cyan); margin-bottom:.25em; }
.msg .when{ font-size:.68em; color:var(--text-faint); margin-top:.3em; }
.msg.mine{ align-self:flex-end; background:var(--cyan-dim); border-color:var(--cyan-dim); }
.msg.pinned{ border-color:var(--amber-dim); }
.composer{ display:flex; gap:8px; }
.composer input{ flex:1; padding:.65em .8em; background:var(--bg); border:1px solid var(--panel-border); border-radius:var(--radius); color:var(--text); }
.composer input:focus{ border-color:var(--cyan); }

.people-list{ display:flex; flex-direction:column; gap:2px; }
.people-list .p-item{ padding:.6em .7em; border-radius:var(--radius); font-size:.86em; color:var(--text-muted); display:flex; justify-content:space-between; background:transparent; width:100%; text-align:left; border:none; }
.people-list .p-item:hover{ background:var(--panel); color:var(--text); cursor:pointer; }
.people-list .p-item.active{ background:var(--panel); color:var(--text); }

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--panel); border:1px solid var(--cyan-dim); color:var(--text); padding:.7em 1em; border-radius:6px; font-size:.86em; box-shadow:0 6px 20px rgba(0,0,0,.4); }

.empty{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:.88em; }
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal{ background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:26px; max-width:420px; width:100%; }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--panel-border); border-radius:6px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---- ÉDITEUR SVG (symboles, bornes, fils, zoom) ---- */
.ws-svg{ width:100%; height:100%; display:block; cursor:grab; color:var(--cyan); }
.ws-svg.panning{ cursor:grabbing; }
.ws-svg.tool-fil{ cursor:crosshair; }
.comp-node{ cursor:move; }
.comp-node.selected > .comp-body{ filter:drop-shadow(0 0 4px var(--amber)); }
.comp-node .comp-body{ color:var(--cyan); }
.comp-node .comp-label{ font-family:var(--font-mono); font-size:7px; fill:var(--text-faint); }
.terminal-dot{ fill:var(--bg); stroke:var(--cyan); stroke-width:1.5; cursor:crosshair; }
.terminal-dot:hover{ fill:var(--amber); stroke:var(--amber); }
.terminal-dot.wiring-start{ fill:var(--amber); stroke:var(--amber); }
.wire-line{ stroke:var(--amber); stroke-width:2; fill:none; }
.wire-preview{ stroke:var(--amber); stroke-width:1.5; stroke-dasharray:4 3; opacity:.7; }

.zoom-controls{ position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:4px; z-index:5; }
.zoom-controls button{ width:32px; height:32px; background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius); color:var(--text); font-size:1em; }
.zoom-controls button:hover{ border-color:var(--amber-dim); }
.zoom-pct{ font-family:var(--font-mono); font-size:.68em; color:var(--text-faint); text-align:center; }

.catalog-item{ position:relative; }
.catalog-item .info-btn{ position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-faint); font-size:.85em; padding:2px 6px; }
.catalog-item .info-btn:hover{ color:var(--cyan); }
.catalog-popover{
  position:fixed; z-index:90; width:260px; background:var(--panel); border:1px solid var(--panel-border);
  border-radius:8px; padding:14px; font-size:.82em; box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.catalog-popover h4{ font-size:1em; margin-bottom:.4em; }
.catalog-popover .wiki-link{ display:inline-block; margin-top:.6em; font-size:.85em; }

.props-panel .field select, .props-panel .field input{ margin-bottom:.3em; }
.props-panel .def-text{ font-size:.8em; color:var(--text-muted); margin:.6em 0; }

.type-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:1.2em; }
@media (max-width:480px){ .type-cards{ grid-template-columns:1fr; } }
.type-card{ border:1px solid var(--panel-border); border-radius:6px; padding:12px 10px; text-align:center; font-size:.8em; color:var(--text-muted); background:var(--bg); }
.type-card.selected{ border-color:var(--amber); color:var(--amber); }
.type-card .t-icon{ font-size:1.3em; display:block; margin-bottom:.3em; }

.member-row{ display:flex; justify-content:space-between; align-items:center; padding:.5em .2em; border-bottom:1px solid var(--trace); font-size:.86em; }

/* ---- workspace en onglets sur mobile ---- */
.ws-mobile-tabs{ display:none; }
@media (max-width:760px){
  .sidebar{ position:fixed; left:0; top:var(--header-h); bottom:0; z-index:50; transform:translateX(-100%); transition:transform .2s; }
  .sidebar.open{ transform:translateX(0); }
  .main{ padding:20px 16px; }
  .grid-3, .grid-2{ grid-template-columns:1fr; }

  .workspace{ flex-direction:column; height:auto; min-height:calc(100vh - var(--header-h)); }
  .ws-mobile-tabs{ display:flex; border-bottom:1px solid var(--panel-border); background:var(--bg-raised); }
  .ws-mobile-tabs button{ flex:1; padding:.7em; background:none; border:none; color:var(--text-muted); font-size:.82em; border-bottom:2px solid transparent; }
  .ws-mobile-tabs button.active{ color:var(--amber); border-color:var(--amber); }
  .ws-tools, .ws-right{ width:100%; border:none; display:none; }
  .ws-tools.mobile-active, .ws-right.mobile-active{ display:block; }
  .ws-canvas-wrap{ display:none; min-height:60vh; }
  .ws-canvas-wrap.mobile-active{ display:flex; }
}
</style>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app"></main>
  <div class="toast-wrap" id="toasts"></div>
  <script>
/* ==========================================================================
   BIBLIOTHÈQUE DE COMPOSANTS — symboles schématiques (SVG), bornes de
   connexion, valeurs modifiables, définitions pédagogiques.
   viewBox de chaque symbole : 0 0 60 30 (sauf mention contraire dans le svg
   lui-même, qui gère son propre viewBox interne via <g>).
   Les bornes ("terminals") sont des coordonnées LOCALES (avant rotation).
   ========================================================================== */

function leadLine(x1,y1,x2,y2){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="2"/>`; }

const SYM = {
  resistance: `${leadLine(0,15,12,15)}${leadLine(48,15,60,15)}<rect x="12" y="7" width="36" height="16" fill="none" stroke="currentColor" stroke-width="2"/>`,
  condensateur: `${leadLine(0,15,26,15)}${leadLine(34,15,60,15)}${leadLine(26,4,26,26)}${leadLine(34,4,34,26)}`,
  diode: `${leadLine(0,15,20,15)}${leadLine(40,15,60,15)}<polygon points="20,5 20,25 40,15" fill="none" stroke="currentColor" stroke-width="2"/>${leadLine(40,5,40,25)}`,
  led: `${leadLine(0,15,20,15)}${leadLine(40,15,60,15)}<polygon points="20,5 20,25 40,15" fill="none" stroke="currentColor" stroke-width="2"/>${leadLine(40,5,40,25)}

// Vue "à plat" de tout le catalogue (communs + par domaine + instruments), pour la recherche globale.
function fullCatalog(){
  const out = COMMON_COMPONENTS.map(c => ({ ...c, groupe:'commun' }));
  Object.entries(COMPONENT_LIBRARY).forEach(([espace, list]) => list.forEach(c => out.push({ ...c, groupe:espace })));
  INSTRUMENT_LIBRARY.forEach(c => out.push({ ...c, groupe:'instrument' }));
  return out;
}
function searchCatalog(query){
  const q = (query||'').trim().toLowerCase();
  if (!q) return [];
  return fullCatalog().filter(c =>
    c.id.toLowerCase().includes(q) || c.nom.toLowerCase().includes(q) || (c.alias||'').toLowerCase().includes(q)
  ).slice(0, 12);
}

    this.currentUser.password = newPassword;
    this.currentUser.mustChangePassword = false;
    return { data:{ ok:true }, error:null };
  },
};

function maskEmail(email){
  const [name, domain] = email.split('@');
  const visible = name.slice(0,2);
  return `${visible}${'•'.repeat(Math.max(name.length-2,2))}@${domain}`;
}

const db = {
  async listProjects({ userId, espace }={}){
    await wait();
    let rows = DB.projects.filter(p => p.ownerId === userId || p.collaborateurs.includes(userId));
    if (espace) rows = rows.filter(p => p.espace === espace);
    return { data: rows, error:null };
  },

  async listSharedProjects(userId){
    await wait();
    return { data: DB.projects.filter(p => p.ownerId !== userId && p.collaborateurs.includes(userId)), error:null };
  },

  async createProject({ ownerId, titre, espace }){
    await wait();
    const p = { id:uid('p'), ownerId, titre, espace, updatedAt:new Date().toISOString().slice(0,10), collaborateurs:[], erreurs:0, schema:{ items:[], wires:[] } };
    DB.projects.unshift(p);
    return { data:p, error:null };
  },

  async getProject(id){ await wait(100); return { data: DB.projects.find(p => p.id === id) || null, error:null }; },

  async saveSchema(id, schema){
    await wait(80);
    const p = DB.projects.find(p => p.id === id);
    if (p){ p.schema = schema; p.updatedAt = new Date().toISOString().slice(0,10); }
    return { error:null };
  },

  async addCollaborator({ projectId, email }){
    await wait();
    const p = DB.projects.find(p => p.id === projectId);
    const u = DB.users.find(u => u.email.toLowerCase() === email.toLowerCase());
    if (!p) return { error:{ message:'Projet introuvable.' } };
    if (!u) return { error:{ message:'Aucun utilisateur avec cet e-mail.' } };
    if (!p.collaborateurs.includes(u.id)) p.collaborateurs.push(u.id);
    return { data:p, error:null };
  },

  async deleteProject(id){ await wait(); DB.projects = DB.projects.filter(p => p.id !== id); return { error:null }; },

  async listComments(projectId){ await wait(120); return { data: DB.comments.filter(c => c.projectId === projectId), error:null }; },

  async addComment({ projectId, userId, texte }){
    await wait(120);
    const c = { id:uid('c'), projectId, userId, texte, createdAt:new Date().toISOString().slice(0,16).replace('T',' ') };
    DB.comments.push(c);
    return { data:c, error:null };
  },

  async listCommonMessages(){ await wait(120); return { data:[...DB.commonMessages].sort((a,b)=> (b.pinned - a.pinned)), error:null }; },

  async addCommonMessage({ userId, texte }){
    await wait(120);
    const m = { id:uid('m'), userId, texte, createdAt:new Date().toISOString().slice(0,16).replace('T',' '), pinned:false };
    DB.commonMessages.push(m);
    return { data:m, error:null };
  },

  async listPrivateThread(a,b){ await wait(120); return { data: DB.privateThreads[pairKey(a,b)] || [], error:null }; },

  async sendPrivateMessage({ from, to, texte }){
    await wait(120);
    const key = pairKey(from,to);
    if (!DB.privateThreads[key]) DB.privateThreads[key] = [];
    const m = { from, texte, createdAt:new Date().toISOString().slice(0,16).replace('T',' ') };
    DB.privateThreads[key].push(m);
    return { data:m, error:null };
  },

  async listUsers(){ await wait(120); return { data: DB.users, error:null }; },

  // Suggestions : strictement privées entre l'auteur et l'admin.
  async listMySuggestions(userId){
    await wait(120);
    return { data: DB.suggestions.filter(s => s.userId === userId), error:null };
  },
  async listAllSuggestions(){ await wait(120); return { data: DB.suggestions, error:null }; },

  async addSuggestion({ userId, texte }){
    await wait(120);
    const s = { id:uid('s'), userId, texte, statut:'en attente', reponseAdmin:null, createdAt:new Date().toISOString().slice(0,10) };
    DB.suggestions.push(s);
    return { data:s, error:null };
  },

  async answerSuggestion({ id, reponse }){
    await wait(120);
    const s = DB.suggestions.find(s => s.id === id);
    if (s){ s.reponseAdmin = reponse; s.statut = 'traitée'; }
    return { data:s, error:null };
  },

  async addGroupMember({ userId, nom, email }){
    await wait(120);
    const u = DB.users.find(u => u.id === userId);
    if (!u) return { error:{ message:'Utilisateur introuvable.' } };
    u.members.push({ id:uid('mb'), nom, email });
    return { data:u.members, error:null };
  },

  adminStats(){
    return {
      utilisateurs: DB.users.length,
      projets: DB.projects.length,
      messages: DB.commonMessages.length + Object.values(DB.privateThreads).reduce((n,t)=>n+t.length,0),
    };
  },

  userById(id){ return DB.users.find(u => u.id === id); },
};

/* ==========================================================================
   ROUTEUR
   ========================================================================== */
const PUBLIC_ROUTES = ['', 'login', 'register', 'forgot', 'reset-email', 'change-password'];
function currentRoute(){ return location.hash.replace(/^#\/?/, ''); }
function go(route){ location.hash = '#/' + route; }
window.go = go;

const AFTER = {
  login: () => afterLoginView(), register: () => afterRegisterView(), forgot: () => afterForgotView(),
  'reset-email': () => afterResetEmailView(), 'change-password': () => afterChangePasswordView(),
  dashboard: () => afterDashboardView(), 'shared': () => afterDashboardView(),
  project: () => afterProjectView(),
  discussion: () => afterDiscussionView(), messages: () => afterMessagesView(),
  admin: () => afterAdminView(), compte: () => afterCompteView(),
};

let __renderGen = 0;
async function render(){
  const myGen = ++__renderGen;
  const route = currentRoute();
  const [base, param] = route.split('/');
  const needsAuth = !PUBLIC_ROUTES.includes(base);
  if (needsAuth && !auth.currentUser){ go('login'); return; }
  if (auth.currentUser && auth.currentUser.mustChangePassword && base !== 'change-password'){ go('change-password'); return; }
  if (base === 'admin' && auth.currentUser?.role !== 'admin'){ go('dashboard'); toast("Accès réservé à l'administrateur."); return; }

  const routes = {
    ''          : viewLanding, 'login':viewLogin, 'register':viewRegister, 'forgot':viewForgot,
    'reset-email': viewResetEmail, 'change-password': viewChangePassword,
    'dashboard' : () => viewDashboard(param), 'shared': viewShared,
    'project'   : () => viewProject(param), 'discussion': viewDiscussion, 'messages': viewMessages,
    'compte'    : viewCompte, 'admin': () => viewAdmin(param || 'overview'),
  };
  const fn = routes[base] || (() => `<div class="empty">Page introuvable. <a href="#/">Retour</a></div>`);
  const result = fn();
  const html = (result && result.then) ? await result : result;

  // Une navigation plus récente a déjà eu lieu pendant ce calcul asynchrone : on abandonne ce rendu obsolète.
  if (myGen !== __renderGen) return;

  renderTopbar(route);
  $app.innerHTML = html;
  window.scrollTo?.(0,0);
  AFTER[base]?.();
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

   ÉDITEUR DE SCHÉMA — le cœur de l'espace de travail
   ========================================================================== */
const wsState = { projectId:null, view:{ panX:100, panY:80, scale:1 }, tool:'select', wireStart:null, selectedId:null, mobileTab:'canvas', schema:null };

function rotatePointAround(px,py,cx,cy,angleDeg){
  const rad = angleDeg*Math.PI/180;
  const dx=px-cx, dy=py-cy;
  return { x: cx + dx*Math.cos(rad) - dy*Math.sin(rad), y: cy + dx*Math.sin(rad) + dy*Math.cos(rad) };
}
function findDef(typeId){
  const common = COMMON_COMPONENTS.find(c=>c.id===typeId); if (common) return common;
  for (const list of Object.values(COMPONENT_LIBRARY)) { const f = list.find(c=>c.id===typeId); if (f) return f; }
  return INSTRUMENT_LIBRARY.find(c=>c.id===typeId);
}
function terminalAbsPos(item, idx){
  const def = findDef(item.typeId);
  const [tx,ty] = def.terminals[idx];
  const r = rotatePointAround(tx,ty,30,15,item.rot||0);
  return { x:item.x + r.x, y:item.y + r.y };
}

function renderCanvasSVG(){
  const v = wsState.view;
  const items = wsState.schema.items, wires = wsState.schema.wires;
  const wiresSvg = wires.map(w => {
    const a = terminalAbsPos(items.find(i=>i.id===w.a.itemId), w.a.term);
    const b = terminalAbsPos(items.find(i=>i.id===w.b.itemId), w.b.term);
    return `<line class="wire-line" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  }).join('');
  const itemsSvg = items.map(item => {
    const def = findDef(item.typeId);
    const sym = SYM[item.typeId] || '';
    const selected = item.id === wsState.selectedId ? 'selected' : '';
    const terms = def.terminals.map((t,idx) => `<circle class="terminal-dot ${wsState.wireStart && wsState.wireStart.itemId===item.id && wsState.wireStart.term===idx ? 'wiring-start':''}" data-term-item="${item.id}" data-term-idx="${idx}" cx="${t[0]}" cy="${t[1]}" r="3.4"/>`).join('');
    const valueLabel = def.unit ? `<text class="comp-label" x="6" y="-4">${esc(item.value)}${esc(def.unit.split(' ')[0]==='V'||def.unit.split(' ')[0]==='Ω'?'':'')}</text>` : '';
    return `<g class="comp-node ${selected}" data-item="${item.id}" transform="translate(${item.x},${item.y}) rotate(${item.rot||0},30,15)">
      <g class="comp-body">${sym}</g>
      ${terms}
    </g>`;
  }).join('');
  return `<svg class="ws-svg tool-${wsState.tool}" id="ws-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
    <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/></marker></defs>
    <g id="ws-viewport" transform="translate(${v.panX},${v.panY}) scale(${v.scale})">
      ${wiresSvg}
      ${itemsSvg}
      <line id="wire-preview-line" class="wire-preview" style="display:none" x1="0" y1="0" x2="0" y2="0"/>
    </g>
  </svg>`;
}

function clientToSvgUser(evt, svg){ const pt = svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function svgUserToCanvas(pt){ const v = wsState.view; return { x:(pt.x - v.panX)/v.scale, y:(pt.y - v.panY)/v.scale }; }

async function persistSchema(){ if (wsState.projectId) await db.saveSchema(wsState.projectId, wsState.schema); }

function redrawCanvas(){
  const holder = document.getElementById('ws-canvas-holder');
  if (!holder) return;
  const zoomCtrls = holder.querySelector('.zoom-controls');
  holder.innerHTML = renderCanvasSVG();
  if (zoomCtrls) holder.appendChild(zoomCtrls);
  document.getElementById('zoom-pct').textContent = Math.round(wsState.view.scale*100)+'%';
  wireCanvasEvents();
}

function wireCanvasEvents(){
  const svg = document.getElementById('ws-svg');
  if (!svg) return;

  // Aperçu du fil en cours de traçage : suit la souris entre la borne de départ et le pointeur.
  svg.addEventListener('mousemove', (e) => {
    if (wsState.tool !== 'fil' || !wsState.wireStart) return;
    const line = document.getElementById('wire-preview-line');
    if (!line) return;
    const startItem = wsState.schema.items.find(i=>i.id===wsState.wireStart.itemId);
    if (!startItem) return;
    const a = terminalAbsPos(startItem, wsState.wireStart.term);
    const cur = svgUserToCanvas(clientToSvgUser(e, svg));
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', cur.x); line.setAttribute('y2', cur.y);
    line.style.display = '';
  });

  // Échap annule un fil en cours de traçage (lié une seule fois, jamais empilé aux redraws).
  if (!window.__wireEscBound){
    window.__wireEscBound = true;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && wsState.wireStart){ wsState.wireStart = null; redrawCanvas(); }
    });
  }

  svg.querySelectorAll('.terminal-dot').forEach(dot => {
    dot.addEventListener('mousedown', (e) => e.stopPropagation());
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      if (wsState.tool !== 'fil') return;
      const itemId = dot.dataset.termItem, term = Number(dot.dataset.termIdx);
      if (!wsState.wireStart){ wsState.wireStart = { itemId, term }; redrawCanvas(); return; }
      if (wsState.wireStart.itemId === itemId && wsState.wireStart.term === term){ wsState.wireStart = null; redrawCanvas(); return; }
      wsState.schema.wires.push({ id:'w_'+Math.random().toString(36).slice(2,8), a:wsState.wireStart, b:{itemId,term} });
      wsState.wireStart = null; persistSchema(); redrawCanvas();
    });
  });

  svg.querySelectorAll('.comp-node').forEach(node => {
    let dragging=false, startPt=null, orig=null, moved=false;
    node.addEventListener('mousedown', (e) => {
      if (wsState.tool === 'supprimer') return; // géré au click
      if (wsState.tool === 'fil') return;
      e.stopPropagation();
      const item = wsState.schema.items.find(i=>i.id===node.dataset.item);
      dragging = true; moved = false; startPt = clientToSvgUser(e, svg); orig = { x:item.x, y:item.y };
      const onMove = (ev) => {
        const cur = clientToSvgUser(ev, svg);
        const dx = (cur.x-startPt.x)/wsState.view.scale, dy=(cur.y-startPt.y)/wsState.view.scale;
        if (Math.abs(dx)+Math.abs(dy) > 2) moved = true;
        item.x = orig.x+dx; item.y = orig.y+dy;
        redrawCanvasLight();
      };
      const onUp = () => { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp);
        dragging=false; persistSchema();
        if (!moved){ selectItem(item.id); } else { redrawCanvas(); }
      };
      document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
    });
    node.addEventListener('click', (e) => {
      if (wsState.tool === 'supprimer'){
        e.stopPropagation();
        const id = node.dataset.item;
        wsState.schema.items = wsState.schema.items.filter(i=>i.id!==id);
        wsState.schema.wires = wsState.schema.wires.filter(w=>w.a.itemId!==id && w.b.itemId!==id);
        if (wsState.selectedId===id) wsState.selectedId=null;
        persistSchema(); redrawCanvas(); toast('Élément supprimé.');
      }
    });
  });

  // clic droit : annule un fil en cours plutôt que d'ouvrir le menu contextuel du navigateur
  svg.addEventListener('contextmenu', (e) => {
    if (wsState.tool === 'fil' && wsState.wireStart){ e.preventDefault(); wsState.wireStart = null; redrawCanvas(); }
  });

  // pan + zoom sur fond
  let panning=false, panStart=null, panOrig=null;
  svg.addEventListener('mousedown', (e) => {
    if (e.target !== svg) return;
    panning = true; svg.classList.add('panning'); panStart = clientToSvgUser(e, svg); panOrig = { ...wsState.view };
    const onMove = (ev) => {
      const cur = clientToSvgUser(ev, svg);
      wsState.view.panX = panOrig.panX + (cur.x - panStart.x);
      wsState.view.panY = panOrig.panY + (cur.y - panStart.y);
      document.getElementById('ws-viewport').setAttribute('transform', `translate(${wsState.view.panX},${wsState.view.panY}) scale(${wsState.view.scale})`);
    };
    const onUp = () => { panning=false; svg.classList.remove('panning'); document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  });

  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const before = svgUserToCanvas(clientToSvgUser(e, svg));
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    wsState.view.scale = Math.min(4, Math.max(0.35, wsState.view.scale*factor));
    const svgUserNow = clientToSvgUser(e, svg);
    wsState.view.panX = svgUserNow.x - before.x*wsState.view.scale;
    wsState.view.panY = svgUserNow.y - before.y*wsState.view.scale;
    redrawCanvas();
  }, { passive:false });
}

function redrawCanvasLight(){
  // pendant un glisser de composant : on ne recalcule que positions + fils, sans réattacher tous les handlers
  const svg = document.getElementById('ws-svg');
  if (!svg) return;
  wsState.schema.items.forEach(item => {
    const g = svg.querySelector(`.comp-node[data-item="${item.id}"]`);
    if (g) g.setAttribute('transform', `translate(${item.x},${item.y}) rotate(${item.rot||0},30,15)`);
  });
  wsState.schema.wires.forEach(w => {
    const line = svg.querySelectorAll('.wire-line')[wsState.schema.wires.indexOf(w)];
  });
  // fils : plus simple de les redessiner entièrement (peu coûteux)
  const viewport = document.getElementById('ws-viewport');
  viewport.querySelectorAll('.wire-line').forEach(l=>l.remove());
  const wiresSvg = wsState.schema.wires.map(w => {
    const a = terminalAbsPos(wsState.schema.items.find(i=>i.id===w.a.itemId), w.a.term);
    const b = terminalAbsPos(wsState.schema.items.find(i=>i.id===w.b.itemId), w.b.term);
    return `<line class="wire-line" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  }).join('');
  viewport.insertAdjacentHTML('afterbegin', wiresSvg);
}

function selectItem(id){
  wsState.selectedId = id;
  document.querySelectorAll('.ws-tab').forEach(t=>t.classList.remove('active'));
  const propsTab = [...document.querySelectorAll('.ws-tab')].find(t=>t.dataset.tab==='proprietes');
  propsTab?.classList.add('active');
  document.getElementById('ws-panel').innerHTML = window.__wsPanels.proprietes();
  redrawCanvas();
  wirePropsPanel();
}

function wirePropsPanel(){
  document.getElementById('prop-value')?.addEventListener('change', (e) => {
    const item = wsState.schema.items.find(i=>i.id===wsState.selectedId);
    item.value = e.target.value; persistSchema();
  });
  document.getElementById('prop-rotate')?.addEventListener('click', () => {
    const item = wsState.schema.items.find(i=>i.id===wsState.selectedId);
    item.rot = ((item.rot||0)+90)%360; persistSchema(); redrawCanvas();
  });
  document.getElementById('prop-delete')?.addEventListener('click', () => {
    const id = wsState.selectedId;
    wsState.schema.items = wsState.schema.items.filter(i=>i.id!==id);
    wsState.schema.wires = wsState.schema.wires.filter(w=>w.a.itemId!==id && w.b.itemId!==id);
    wsState.selectedId = null; persistSchema(); redrawCanvas();
    document.getElementById('ws-panel').innerHTML = window.__wsPanels.proprietes();
  });
}

function afterProjectView(){
  if (!window.__wsPanels) return;
  wireCanvasEvents();

  const $panel = document.getElementById('ws-panel');
  document.querySelectorAll('.ws-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.ws-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      $panel.innerHTML = window.__wsPanels[tab.dataset.tab]();
      wireCommentForm(); wirePropsPanel();
    };
  });
  wireCommentForm();

  document.getElementById('btn-test-circuit')?.addEventListener('click', () => toast('Simulation lancée — moteur de calcul électrique à intégrer dans une prochaine étape.'));
  document.getElementById('btn-save-project')?.addEventListener('click', async () => { await persistSchema(); toast('Projet enregistré.'); });
  document.getElementById('btn-share')?.addEventListener('click', () => {
    const email = prompt("E-mail de la personne avec qui partager ce projet :");
    if (!email) return;
    db.addCollaborator({ projectId: wsState.projectId, email }).then(({error}) => {
      if (error) toast(error.message); else toast('Projet partagé.');
    });
  });

  // Délégation sur le panneau outils : couvre aussi les résultats de recherche injectés dynamiquement.
  const $tools = document.querySelector('.ws-tools');
  $tools?.addEventListener('click', (e) => {
    const placeBtn = e.target.closest('[data-place]');
    if (placeBtn){
      const typeId = placeBtn.dataset.place; const def = findDef(typeId);
      const center = svgUserToCanvas({ x:500, y:300 });
      wsState.schema.items.push({ id:'i_'+Math.random().toString(36).slice(2,8), typeId, x:center.x-30+Math.random()*30, y:center.y-15+Math.random()*30, rot:0, value: def.defaultValue ?? '' });
      persistSchema(); redrawCanvas(); toast(`${def.nom} ajouté.`);
      return;
    }
    const toolBtn = e.target.closest('[data-tool]');
    if (toolBtn){
      wsState.tool = toolBtn.dataset.tool; wsState.wireStart = null;
      const label = { select:'Sélection', fil:'Tracer un fil', supprimer:'Supprimer' }[wsState.tool];
      document.getElementById('tool-indicator').textContent = 'Outil : ' + label;
      redrawCanvas();
      return;
    }
    const infoBtn = e.target.closest('[data-info]');
    if (infoBtn){
      const def = findDef(infoBtn.dataset.info);
      showCatalogPopover(def, infoBtn);
    }
  });

  document.getElementById('ws-search')?.addEventListener('input', (e) => {
    const results = searchCatalog(e.target.value);
    const $r = document.getElementById('ws-search-results');
    $r.innerHTML = !e.target.value.trim() ? '' : (results.length
      ? results.map(c => `<div class="catalog-item"><button class="ws-comp" data-place="${c.id}">▫ ${esc(c.nom)}</button><button class="info-btn" data-info="${c.id}" title="En savoir plus">ⓘ</button></div>`).join('')
      : `<div class="empty" style="padding:10px 4px;font-size:.78em">Aucun résultat.</div>`);
  });

  document.getElementById('zoom-in')?.addEventListener('click', () => { wsState.view.scale = Math.min(4, wsState.view.scale*1.2); redrawCanvas(); });
  document.getElementById('zoom-out')?.addEventListener('click', () => { wsState.view.scale = Math.max(0.35, wsState.view.scale/1.2); redrawCanvas(); });

  document.querySelectorAll('[data-mtab]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-mtab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelector('.ws-tools').classList.toggle('mobile-active', b.dataset.mtab==='tools');
    document.querySelector('.ws-canvas-wrap').classList.toggle('mobile-active', b.dataset.mtab==='canvas');
    document.querySelector('.ws-right').classList.toggle('mobile-active', b.dataset.mtab==='right');
  });

  function wireCommentForm(){
    const form = document.getElementById('form-comment');
    if (!form) return;
    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      await db.addComment({ projectId: wsState.projectId, userId:auth.currentUser.id, texte:f.get('texte') });
      toast('Commentaire ajouté.'); render();
    };
  }
}

function showCatalogPopover(def, anchorEl){
  document.querySelectorAll('.catalog-popover').forEach(p=>p.remove());
  const rect = anchorEl.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'catalog-popover';
  pop.style.left = Math.min(rect.left, window.innerWidth-280) + 'px';
  pop.style.top = (rect.bottom+6) + 'px';
  pop.innerHTML = `<h4>${esc(def.nom)}</h4><p style="margin:0">${esc(def.def)}</p><a class="wiki-link" href="${wikiUrl(def.wiki)}" target="_blank" rel="noopener">En savoir plus (source externe) →</a>`;
  document.body.appendChild(pop);
  const close = (ev) => { if (!pop.contains(ev.target) && ev.target!==anchorEl){ pop.remove(); document.removeEventListener('click',close); } };
  setTimeout(()=>document.addEventListener('click', close), 10);
}

async function viewDiscussion(){
  const { data: messages } = await db.listCommonMessages();
  const isAdmin = auth.currentUser.role === 'admin';
  const { data: suggestions } = isAdmin ? await db.listAllSuggestions() : await db.listMySuggestions(auth.currentUser.id);
  return `<div class="app-shell">${renderSidebar()}
    <div class="main"><div class="grid grid-2">
      <div class="card"><h3>Discussion & suggestions</h3><p>Visible par tous les utilisateurs connectés.</p>
        <div class="thread">${messages.map(m => { const u=db.userById(m.userId);
          return `<div class="msg ${m.pinned?'pinned':''} ${m.userId===auth.currentUser.id?'mine':''}"><div class="who">${m.pinned?'📌 ':''}${esc(u?.prenom)} ${esc(u?.nom)}</div>${esc(m.texte)}<div class="when">${m.createdAt}</div></div>`;
        }).join('')}</div>
        <form class="composer" id="form-common"><input name="texte" placeholder="Partagez une idée, une question…" required><button class="btn btn-primary btn-sm">Envoyer</button></form>
      </div>
      <div class="card"><h3>${isAdmin ? 'Toutes les suggestions' : 'Mes suggestions'}</h3><p>${isAdmin ? 'Visibles uniquement par vous (admin) et leur auteur respectif.' : 'Visibles uniquement par vous et l\'administrateur.'}</p>
        <div class="thread">${suggestions.map(s => `<div class="msg ${s.userId===auth.currentUser.id?'mine':''}"><div class="who">${esc(db.userById(s.userId)?.prenom)} · ${s.statut}</div>${esc(s.texte)}
          ${s.reponseAdmin ? `<div class="when" style="color:var(--cyan)">Réponse : ${esc(s.reponseAdmin)}</div>` : ''}</div>`).join('')}
        </div>
        ${isAdmin ? '' : `<form class="composer" id="form-suggestion"><input name="texte" placeholder="Nouvelle suggestion à l'admin…" required><button class="btn btn-sm">Envoyer</button></form>`}
      </div>
    </div></div></div>`;
}
function afterDiscussionView(){
  document.getElementById('form-common')?.addEventListener('submit', async (e) => { e.preventDefault(); await db.addCommonMessage({ userId:auth.currentUser.id, texte:new FormData(e.target).get('texte') }); render(); });
  document.getElementById('form-suggestion')?.addEventListener('submit', async (e) => { e.preventDefault(); await db.addSuggestion({ userId:auth.currentUser.id, texte:new FormData(e.target).get('texte') }); toast('Suggestion envoyée.'); render(); });
}

/* ==========================================================================
   MESSAGERIE PRIVÉE
   ========================================================================== */
async function viewMessages(){
  const { data: users } = await db.listUsers();
  const others = users.filter(u => u.id !== auth.currentUser.id);
  const active = state.chatWith || others[0]?.id;
  const { data: thread } = active ? await db.listPrivateThread(auth.currentUser.id, active) : { data:[] };
  return `<div class="app-shell">${renderSidebar()}
    <div class="main"><div class="grid" style="grid-template-columns:220px 1fr;gap:16px">
      <div class="card pad-0"><div style="padding:14px 14px 4px"><strong style="font-size:.88em">Contacter un utilisateur</strong></div>
        <div class="people-list" style="padding:0 8px 10px">${others.map(u => `<button class="p-item ${u.id===active?'active':''}" data-user="${u.id}">${esc(u.prenom)} ${esc(u.nom)}</button>`).join('') || '<div class="empty">Aucun autre utilisateur.</div>'}</div>
      </div>
      <div class="card"><h3>${active ? esc(db.userById(active).prenom)+' '+esc(db.userById(active).nom) : 'Conversations'}</h3>
        <div class="thread">${thread.length ? thread.map(m => `<div class="msg ${m.from===auth.currentUser.id?'mine':''}">${esc(m.texte)}<div class="when">${m.createdAt}</div></div>`).join('') : '<div class="empty">Aucun message. Dites bonjour 👋</div>'}</div>
        <form class="composer" id="form-private"><input name="texte" placeholder="Votre message…" required><button class="btn btn-primary btn-sm">Envoyer</button></form>
      </div>
    </div></div></div>`;
}
function afterMessagesView(){
  document.querySelectorAll('[data-user]').forEach(b => b.onclick = () => { state.chatWith = b.dataset.user; render(); });
  document.getElementById('form-private')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { data: users } = await db.listUsers();
    const to = state.chatWith || users.find(u=>u.id!==auth.currentUser.id)?.id;
    if (!to) return;
    await db.sendPrivateMessage({ from:auth.currentUser.id, to, texte:new FormData(e.target).get('texte') });
    render();
  });
}

/* ==========================================================================
   COMPTE (+ gestion des membres si groupe/communauté)
   ========================================================================== */
function viewCompte(){
  const u = auth.currentUser;
  const type = ACCOUNT_TYPES[u.accountType] || ACCOUNT_TYPES.solo;
  return `<div class="app-shell">${renderSidebar('compte')}
    <div class="main" style="max-width:560px">
      <div class="main-header"><h2>Paramètres du compte</h2></div>
      <div class="card">
        <div class="field"><label>Prénom</label><input value="${esc(u.prenom)}" disabled></div>
        <div class="field"><label>Nom</label><input value="${esc(u.nom)}" disabled></div>
        <div class="field"><label>E-mail</label><input value="${esc(u.email)}" disabled></div>
        <div class="field"><label>Type de compte</label><input value="${type.icon} ${type.label}" disabled></div>
      </div>
      ${u.accountType !== 'solo' ? `
      <div class="card" style="margin-top:16px">
        <h3>Membres de votre ${u.accountType === 'groupe' ? 'groupe' : 'communauté'}</h3>
        <p style="font-size:.85em">Vous êtes responsable — ajoutez ici les personnes qui travailleront avec vous.</p>
        <div id="members-list">${(u.members||[]).map(m => `<div class="member-row"><span>${esc(m.nom)}</span><span style="color:var(--text-faint)">${esc(m.email)}</span></div>`).join('') || '<div class="empty">Aucun membre ajouté.</div>'}</div>
        <form class="composer" id="form-add-member" style="margin-top:12px">
          <input name="nom" placeholder="Nom du membre" required style="flex:1">
          <input name="email" type="email" placeholder="E-mail du membre" required style="flex:1">
          <button class="btn btn-primary btn-sm">Ajouter</button>
        </form>
      </div>` : ''}
    </div></div>`;
}
function afterCompteView(){
  document.getElementById('form-add-member')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await db.addGroupMember({ userId:auth.currentUser.id, nom:f.get('nom'), email:f.get('email') });
    toast('Membre ajouté.'); render();
  });
}

/* ==========================================================================
   ADMIN
   ========================================================================== */
async function viewAdmin(section){
  const stats = db.adminStats();
  const { data: users } = await db.listUsers();
  const { data: suggestions } = await db.listAllSuggestions();
  const sidebar = `<aside class="sidebar"><div class="sb-label">Espace administrateur</div>
    <a href="#/admin/overview" class="sb-link ${section==='overview'?'active':''}">📊 Vue d'ensemble</a>
    <a href="#/admin/users" class="sb-link ${section==='users'?'active':''}">👤 Utilisateurs</a>
    <a href="#/admin/projects" class="sb-link ${section==='projects'?'active':''}">📁 Tous les projets</a>
    <a href="#/admin/suggestions" class="sb-link ${section==='suggestions'?'active':''}">💡 Suggestions</a></aside>`;

  let content = '';
  if (section === 'overview'){
    content = `<div class="grid grid-3">
      <div class="card stat"><div class="num">${stats.utilisateurs}</div><div class="lbl">Utilisateurs</div></div>
      <div class="card stat"><div class="num">${stats.projets}</div><div class="lbl">Projets</div></div>
      <div class="card stat"><div class="num">${stats.messages}</div><div class="lbl">Messages échangés</div></div>
    </div>`;
  } else if (section === 'users'){
    content = `<div class="card"><table class="data-table"><tr><th>Nom</th><th>E-mail</th><th>Type</th><th>Rôle</th><th>Créé le</th></tr>
      ${users.map(u => `<tr><td>${esc(u.prenom)} ${esc(u.nom)}</td><td>${esc(u.email)}</td><td>${ACCOUNT_TYPES[u.accountType]?.label||''}</td><td>${u.role}</td><td>${u.createdAt}</td></tr>`).join('')}
    </table></div>`;
  } else if (section === 'projects'){
    const full = (await Promise.all(users.map(u => db.listProjects({ userId:u.id })))).flatMap(r=>r.data);
    const uniq = [...new Map(full.map(p=>[p.id,p])).values()];
    content = `<div class="card"><table class="data-table"><tr><th>Titre</th><th>Espace</th><th>Propriétaire</th><th>Mis à jour</th></tr>
      ${uniq.map(p => `<tr><td>${esc(p.titre)}</td><td>${ESPACES[p.espace]?.nom}</td><td>${esc(db.userById(p.ownerId)?.prenom||'')}</td><td>${p.updatedAt}</td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-faint)">Aucun projet créé pour l\'instant.</td></tr>'}
    </table></div>`;
  } else if (section === 'suggestions'){
    content = `<div class="card">${suggestions.map(s => `
      <div class="msg" style="max-width:100%;margin-bottom:10px"><div class="who">${esc(db.userById(s.userId)?.prenom)} · ${s.statut}</div>${esc(s.texte)}
      ${s.reponseAdmin ? `<div class="when" style="color:var(--cyan)">Réponse : ${esc(s.reponseAdmin)}</div>` :
        `<form class="composer" data-suggestion="${s.id}" style="margin-top:8px"><input name="reponse" placeholder="Répondre…" required><button class="btn btn-sm">OK</button></form>`}
      </div>`).join('') || '<div class="empty">Aucune suggestion pour l\'instant.</div>'}</div>`;
  }
  return `<div class="app-shell">${sidebar}<div class="main"><div class="main-header"><h2>Administration</h2></div>${content}</div></div>`;
}
function afterAdminView(){
  document.querySelectorAll('[data-suggestion]').forEach(form => form.onsubmit = async (e) => {
    e.preventDefault();
    await db.answerSuggestion({ id:form.dataset.suggestion, reponse:new FormData(e.target).get('reponse') });
    toast('Réponse envoyée.'); render();
  });
}
  </script>
</body>
</html>
